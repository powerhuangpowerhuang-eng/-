name: Links

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
  schedule:
    # 每周一 02:17 UTC（北京时间 10:17）；定期发现外部链接变化。
    - cron: '17 2 * * 1'

permissions:
  contents: read

concurrency:
  group: links-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lychee:
    name: Lychee
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: --config lychee.toml --verbose --no-progress './**/*.md' './**/*.html'
          fail: true
          failIfEmpty: true
          output: ${{ runner.temp }}/lychee-report.md
